name: OIDC Stage Debug

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    name: Verbose stage publish
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout rc.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v0.1.1-rc.2
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install
        run: npm ci --ignore-scripts
      - name: Stage publish with verbose logging
        continue-on-error: true
        run: npm stage publish --tag next --loglevel verbose 2>&1 | tail -80
