name: OIDC Debug

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  claims:
    name: Decode OIDC claims
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch and decode the npm audience token
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          payload=$(echo "$token" | cut -d. -f2)
          python3 -c 'import base64,json,sys; s=sys.argv[1]; s+="="*(-len(s)%4); d=json.loads(base64.urlsafe_b64decode(s)); print(json.dumps({k:d.get(k) for k in ["sub","repository","repository_owner","repository_owner_id","ref","workflow","workflow_ref","event_name"]}, indent=2))' "$payload"
